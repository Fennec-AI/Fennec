services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-4.6}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      LLM_FALLBACKS: ${LLM_FALLBACKS:-}
      FENNEC_DATA_DIR: /app/data
      FENNEC_DOCKER_IMAGE: fennec-linux:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/fennec/state:/app/data
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    volumes:
      - /data/fennec/access.htpasswd:/etc/nginx/access.htpasswd:ro
      - /data/fennec/nginx.conf:/etc/nginx/conf.d/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
